<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: "Comic Sans MS", cursive, sans-serif;
    }

    .card {
      background: white;
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin-bottom: 30px;
      color: #ff4d6d;
      font-size: 2.2rem;
    }

    .buttons {
      position: relative;
      height: 80px;
    }

    button {
      font-size: 1.1rem;
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      margin-right: 20px;
    }

    #yesBtn:hover {
      transform: scale(1.05);
      background: #ff3355;
    }

    #noBtn {
      position: absolute;
      background: #e0e0e0;
      color: #333;
    }

    .message {
      margin-top: 25px;
      font-size: 1.4rem;
      color: #ff4d6d;
      display: none;
    }
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 3s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
      }
    }

    .sparkle {
      position: fixed;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      animation: sparkle 2.5s linear forwards;
      pointer-events: none;
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0); }
      30% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.3); }
    }
  }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my valetine my lovely jubbley 💖</h1>
    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
    <div class="message" id="message">Yay!! 💕🥰<br/><span id="personalMessage" style="display:block; margin-top:10px; font-size:1.1rem;">Best decision you’ve made all day 😘</span></div>
    <img id="yesPhoto" src="./pic1234.jpg" alt="Valentine photo" style="display:none; margin-top:20px; width:120px; max-width:70%; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.2);" />
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");
    let yesScale = 1;

    noBtn.style.left = "140px";
    noBtn.style.top = "0px";

    noBtn.addEventListener("mousemove", () => {
      const x = Math.random() * 400 - 200;
      const y = Math.random() * 200 - 100;
      noBtn.style.transition = "transform 0.05s linear";
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    noBtn.addEventListener("click", () => {
      yesScale += 0.15;
      yesBtn.style.transform = `scale(${yesScale})`;
    });

    yesBtn.addEventListener("click", () => {
      message.style.display = "block";
      const photo = document.getElementById("yesPhoto");
      photo.style.display = "block";

      for (let i = 0; i < 25; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = 2 + Math.random() * 2 + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
      }
    });
    // background sparkles
    setInterval(() => {
      const sparkle = document.createElement("div");
      sparkle.className = "sparkle";
      sparkle.style.left = Math.random() * 100 + "vw";
      sparkle.style.top = Math.random() * 100 + "vh";
      document.body.appendChild(sparkle);

      setTimeout(() => sparkle.remove(), 2500);
    }, 200);
  </script>
</body>
</html>
